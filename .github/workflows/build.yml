name: build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # to attach the exe to a release when a v* tag is pushed

jobs:
  build:
    # The app targets Windows, but the .NET SDK cross-builds it from Linux (EnableWindowsTargeting),
    # which is faster and uses half the Actions minutes of a Windows runner.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Test
        run: dotnet test tests/NetworkShares.Tests -c Release

      # A v1.2.3 tag builds version 1.2.3 (shown in About); other builds keep the project's version.
      - name: Version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then echo "VERSION_ARG=-p:Version=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"; fi

      # Portable: one exe with .NET inside, nothing to install. Not compressed, and nothing extracted to a temp folder at
      # launch: self-extracting, compressed executables look like packed malware to antivirus and browser heuristics.
      # The download is zipped anyway.
      - name: Publish (portable, no .NET install needed)
        run: >
          dotnet publish src/NetworkShares -c Release --self-contained $VERSION_ARG
          -p:PublishSingleFile=true -p:DebugType=none -o out

      - uses: actions/upload-artifact@v7
        with:
          name: NetworkShares-win-x64
          path: out/NetworkShares.exe

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          cd out
          zip NetworkShares-win-x64.zip NetworkShares.exe
          # A release drafted on the website already exists (and created the tag): attach the file to it.
          # A tag pushed from git has none yet: create it.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" NetworkShares-win-x64.zip --clobber
          else
            gh release create "$GITHUB_REF_NAME" --target "$GITHUB_SHA" --title "Network Shares ${GITHUB_REF_NAME}" --generate-notes NetworkShares-win-x64.zip
          fi
        env:
          GH_TOKEN: ${{ github.token }}
